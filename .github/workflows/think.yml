# think.yml — The Heartbeat (v0.2)
#
# Wakes the agent on schedule. Runs the ReAct agent loop:
# Observe → Think → Act → Observe → ... until done or max iterations.
#
# The agent is autonomous. It doesn't block on human approval.
# Dangerous actions are deferred, not blocked. The human reviews via git log.

name: think

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: false
        type: string
      max_iterations:
        description: 'Max ReAct iterations'
        required: false
        default: '10'
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  think:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (the agent's body)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Run agent loop
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL }}
          TASK_INPUT: ${{ inputs.task }}
          MAX_ITERATIONS_INPUT: ${{ inputs.max_iterations || '10' }}
        run: python3 .github/scripts/agent.py --task "$TASK_INPUT" --max-iterations "$MAX_ITERATIONS_INPUT"

      - name: Commit everything (memory, scratch, work)
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          git add -A
          git reset .github/workflows/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "think: autonomous cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -m "ReAct loop completed. See MEMORY.md and git log for details."
            git push
          fi
